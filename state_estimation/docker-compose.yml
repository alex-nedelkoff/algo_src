services:
  openvins:
    build:
      context: .
      dockerfile: Dockerfile
    image: corvidx/openvins:latest
    volumes:
      - ./data/euroc:/data/euroc
      - ./results:/results
      - ./configs:/configs:ro
      - ./scripts:/scripts:ro
    network_mode: none
    stdin_open: true
    tty: true

  visualize:
    image: corvidx/openvins:latest
    volumes:
      - ./data/euroc:/data/euroc:ro
      - ./results:/results
      - ./scripts:/scripts:ro
    ports:
      - "9876:9876"
      - "9090:9090"
    command: >
      python3 /scripts/visualize_rerun.py
        --estimate /results/aligned_trajectory.tum
        --groundtruth /data/euroc/MH_01_easy/mav0/state_groundtruth_estimate0/data.csv
        --cam0 /data/euroc/MH_01_easy/mav0/cam0
        --serve
