<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Golden Set Track Viewer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0d1117;
    color: #c9d1d9;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    min-height: 100vh;
  }
  h1 {
    text-align: center;
    padding: 24px 16px 8px;

    font-size: 0.9rem;
    padding-bottom: 16px;

    display: flex;
    justify-content: center;
    gap: 12px;
    padding: 0 16px 16px;
  }

    background: #21262d;

    border: 1px solid #30363d;
    padding: 6px 16px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.85rem;
    transition: background 0.15s;
  }
  .global-controls button:hover {
    background: #30363d;
  }
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    padding: 0 16px 24px;
    max-width: 1600px;
    margin: 0 auto;
  }
  @media (max-width: 900px) {
    .grid { grid-template-columns: 1fr; }
  }
  .viewport-container {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 8px;
    overflow: hidden;
    position: relative;
  }
  .viewport-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 12px;
    background: #0d1117;
    border-bottom: 1px solid #30363d;
  }
  .viewport-header .track-name {
    font-weight: 600;
    font-size: 0.95rem;
    color: #e6edf3;
  }
  .viewport-header .gate-count {
    font-size: 0.8rem;
    color: #8b949e;
  }
  .viewport-header button {
    background: #21262d;
    color: #c9d1d9;
    border: 1px solid #30363d;
    padding: 3px 10px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 0.8rem;
    transition: background 0.15s;
  }
  .viewport-header button:hover {
    background: #30363d;
  }
  .viewport-canvas {
    width: 100%;
    height: 400px;
    position: relative;
  }
</style>

/* ── Helpers ── */

function formatTrackName(key) {
  return key.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
}

/* Rainbow color for gate index i out of n gates */
function gateColor(i, n) {
  const hue = (i / n) * 0.85; /* 0 = red, 0.85 = violet */
  return new THREE.Color().setHSL(hue, 0.9, 0.6);
}

/* Convert our (w,x,y,z) quaternion to Three.js (x,y,z,w) */
function toThreeQuat(wxyz) {
  return new THREE.Quaternion(wxyz[1], wxyz[2], wxyz[3], wxyz[0]);
}

/* ── Viewport State ── */
const viewports = [];
let globalPlaying = true;

function createViewport(trackKey, trackData, container) {
  const n = trackData.positions.length;

  /* DOM */
  const wrapper = document.createElement('div');
  wrapper.className = 'viewport-container';

  const header = document.createElement('div');
  header.className = 'viewport-header';

  const nameSpan = document.createElement('span');
  nameSpan.className = 'track-name';
  nameSpan.textContent = formatTrackName(trackKey);

  const countSpan = document.createElement('span');
  countSpan.className = 'gate-count';
  countSpan.textContent = `${n} gates`;

  const btn = document.createElement('button');
  btn.textContent = 'Pause';

  header.appendChild(nameSpan);
  header.appendChild(countSpan);
  header.appendChild(btn);

  const canvasDiv = document.createElement('div');
  canvasDiv.className = 'viewport-canvas';

  wrapper.appendChild(header);
  wrapper.appendChild(canvasDiv);
  container.appendChild(wrapper);

  /* Scene */
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0d1117);

  /* Camera */
  const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 200);
  camera.position.set(8, 8, 8);
  camera.lookAt(0, 0, 2);

  /* WebGL Renderer */
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  canvasDiv.appendChild(renderer.domElement);

  /* CSS2D Renderer (labels) */
  const labelRenderer = new CSS2DRenderer();
  labelRenderer.domElement.style.position = 'absolute';
  labelRenderer.domElement.style.top = '0';
  labelRenderer.domElement.style.left = '0';
  labelRenderer.domElement.style.pointerEvents = 'none';
  canvasDiv.appendChild(labelRenderer.domElement);

  /* Orbit Controls */
  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.1;
  controls.target.set(0, 0, 2);
  controls.update();

  /* Lighting */
  scene.add(new THREE.AmbientLight(0xffffff, 0.4));
  const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
  dirLight.position.set(5, 10, 7);
  scene.add(dirLight);

  /* Ground grid */
  const gridHelper = new THREE.GridHelper(20, 20, 0x30363d, 0x21262d);
  /* GridHelper is in XZ plane, which maps to our XY ground — rotate so Y=up becomes Z=up visually */
  /* Actually, Three.js Y is up. Our data uses Z as up. We'll remap: data(x,y,z) -> Three(x,z,y) */
  scene.add(gridHelper);

  /* Axes helper */
  const axes = new THREE.AxesHelper(1);
  axes.position.set(-9, 0.01, -9);
  scene.add(axes);

  /* ── Gate Rendering ── */
  /*
   * Coordinate systems:
   *   Data (sim): Z-up, gate normal = local X-axis rotated by quaternion
   *   Three.js:   Y-up
   *   Mapping:    data(x, y, z) → Three(x, z, -y)  [right-handed swap]
   *
   * Gate normal in data space: quat * (1,0,0)
   * All gate quats are yaw-only: [cos(yaw/2), 0, 0, sin(yaw/2)]
   * This rotates around Z in data = around Y in Three.js
   *
   * Strategy: compute the gate normal vector directly from the data-space
   * quaternion using the rotation formula, then convert to Three.js coords.
   * Avoid quaternion remapping entirely — it's error-prone.
   */

  function dataToThree(pos) {
    return new THREE.Vector3(pos[0], pos[2], -pos[1]);
  }

  function computeGateNormalData(wxyz) {
    /* Gate normal = quaternion * (1,0,0) in data Z-up space */
    const w = wxyz[0], x = wxyz[1], y = wxyz[2], z = wxyz[3];
    return [
      1 - 2 * (y * y + z * z),
      2 * (x * y + w * z),
      2 * (x * z - w * y),
    ];
  }

  const gatePositions3D = [];
  const gateNormalsThree = [];

  for (let i = 0; i < n; i++) {
    const pos = dataToThree(trackData.positions[i]);
    gatePositions3D.push(pos);
    const color = gateColor(i, n);

    /* Compute gate normal in Three.js coords */
    const nData = computeGateNormalData(trackData.orientations[i]);
    const normalVec = new THREE.Vector3(nData[0], nData[2], -nData[1]); /* same remap as position */
    normalVec.normalize();
    gateNormalsThree.push(normalVec);

    /* Gate plane: always vertical (yaw-only rotation).
       Compute yaw from the XZ components of normalVec, rotate around Y. */
    const yaw = Math.atan2(normalVec.x, normalVec.z);
    const plane = new THREE.PlaneGeometry(1.5, 1.5);
    const edges = new THREE.EdgesGeometry(plane);
    const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color, linewidth: 2 }));
    line.position.copy(pos);
    line.rotation.set(0, yaw, 0);
    scene.add(line);

    /* Gate fill (transparent) */
    const fillMat = new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.1, side: THREE.DoubleSide });
    const fillMesh = new THREE.Mesh(new THREE.PlaneGeometry(1.5, 1.5), fillMat);
    fillMesh.position.copy(pos);
    fillMesh.rotation.set(0, yaw, 0);
    scene.add(fillMesh);

    /* Gate normal arrow — shows required flight direction */
    const arrow = new THREE.ArrowHelper(normalVec, pos, 0.8, color.getHex(), 0.15, 0.1);
    scene.add(arrow);

    /* Gate label */
    const labelDiv = document.createElement('div');
    labelDiv.textContent = i.toString();
    labelDiv.style.cssText = `
      color: #${color.getHexString()};
      font-size: 13px;
      font-weight: 700;
      text-shadow: 0 0 4px #000, 0 0 2px #000;
      pointer-events: none;
    `;
    const label = new CSS2DObject(labelDiv);
    label.position.copy(pos);
    label.position.y += 1.0;
    scene.add(label);
  }

  /* ── Flight Path ── */
  /* Build path as piecewise segments: exit(i) → approach(i+1) smoothed,
     approach(i) → gate(i) → exit(i) straight through gate.
     This guarantees every gate crossing is front-to-back and the path
     never accidentally loops back through a gate plane. */
  const OFFSET = 0.6;

  /* Simple polyline path: approach → gate center → exit for each gate.
     Uses CatmullRom with low tension to smooth corners without doubling back. */
  const waypoints = [];
  for (let i = 0; i < n; i++) {
    const normal = gateNormalsThree[i];
    const pos = gatePositions3D[i];
    waypoints.push(pos.clone().sub(normal.clone().multiplyScalar(OFFSET)));  /* approach */
    waypoints.push(pos.clone());                                              /* through gate */
    waypoints.push(pos.clone().add(normal.clone().multiplyScalar(OFFSET)));  /* exit */
  }

  const curve = new THREE.CatmullRomCurve3(waypoints, true, 'centripetal', 0.0);
  const pathPoints = curve.getPoints(300);

  /* Color gradient along path */
  const pathGeom = new THREE.BufferGeometry().setFromPoints(pathPoints);
  const pathColors = new Float32Array(pathPoints.length * 3);
  for (let i = 0; i < pathPoints.length; i++) {
    const t = i / pathPoints.length;
    const c = new THREE.Color().setHSL(t * 0.85, 0.8, 0.55);
    pathColors[i * 3] = c.r;
    pathColors[i * 3 + 1] = c.g;
    pathColors[i * 3 + 2] = c.b;
  }
  pathGeom.setAttribute('color', new THREE.BufferAttribute(pathColors, 3));
  const pathMat = new THREE.LineBasicMaterial({ vertexColors: true, transparent: true, opacity: 0.7 });
  const pathLine = new THREE.Line(pathGeom, pathMat);
  scene.add(pathLine);

  /* ── Animated Drone Marker ── */
  const markerGeom = new THREE.SphereGeometry(0.12, 12, 8);
  const markerMat = new THREE.MeshStandardMaterial({ color: 0x58a6ff, emissive: 0x1f6feb, emissiveIntensity: 0.6 });
  const marker = new THREE.Mesh(markerGeom, markerMat);
  scene.add(marker);

  /* Small trail cone to show direction */
  const coneGeom = new THREE.ConeGeometry(0.08, 0.3, 8);
  const coneMat = new THREE.MeshStandardMaterial({ color: 0x58a6ff, emissive: 0x1f6feb, emissiveIntensity: 0.4 });
  const cone = new THREE.Mesh(coneGeom, coneMat);
  scene.add(cone);

  /* ── State ── */
  const state = {
    scene, camera, renderer, labelRenderer, controls,
    curve, marker, cone,
    t: Math.random(), /* start at random position so they don't all sync */
    playing: true,
    btn,
    canvasDiv,
    initialCameraPos: camera.position.clone(),
    initialTarget: controls.target.clone(),
  };

  /* Play/Pause */
  btn.addEventListener('click', () => {
    state.playing = !state.playing;
    btn.textContent = state.playing ? 'Pause' : 'Play';
  });

  /* Resize */
  function resize() {
    const w = canvasDiv.clientWidth;
    const h = canvasDiv.clientHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
    labelRenderer.setSize(w, h);
  }
  resize();

  const resizeObserver = new ResizeObserver(resize);
  resizeObserver.observe(canvasDiv);

  viewports.push(state);
  return state;
}

/* ── Build Grid ── */
const grid = document.getElementById('grid');
const trackKeys = Object.keys(TRACKS);
for (const key of trackKeys) {
  createViewport(key, TRACKS[key], grid);
}

/* ── Animation Loop ── */
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();

  for (const vp of viewports) {
    /* Animate drone marker */
    if (vp.playing && globalPlaying) {
      const speed = 0.06; /* loops per second */
      vp.t = (vp.t + dt * speed) % 1;
    }

    const point = vp.curve.getPointAt(vp.t);
    vp.marker.position.copy(point);

    /* Direction arrow (cone) */
    const tNext = (vp.t + 0.002) % 1;
    const pointNext = vp.curve.getPointAt(tNext);
    const dir = pointNext.clone().sub(point).normalize();
    vp.cone.position.copy(point).add(dir.clone().multiplyScalar(0.2));
    vp.cone.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir);

    /* Render */
    vp.controls.update();
    vp.renderer.render(vp.scene, vp.camera);
    vp.labelRenderer.render(vp.scene, vp.camera);
  }
}

animate();

/* ── Global Controls ── */
window.toggleGlobalPlayPause = function() {
  globalPlaying = !globalPlaying;
  document.getElementById('globalPlayPause').textContent = globalPlaying ? 'Pause All' : 'Play All';
};

window.resetAllCameras = function() {
  for (const vp of viewports) {
    vp.camera.position.copy(vp.initialCameraPos);
    vp.controls.target.copy(vp.initialTarget);
    vp.controls.update();
  }
};

</script>
