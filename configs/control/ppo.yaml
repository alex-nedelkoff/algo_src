_target_: control.algorithms.ppo.PPO

# SB3 PPO hyperparameters — aligned with MonoRace M23 baseline
learning_rate: 3e-4
n_steps: 1000
batch_size: 5000
n_epochs: 10
gamma: 0.999
gae_lambda: 0.95
clip_range: 0.2
ent_coef: 0.005
vf_coef: 0.5
max_grad_norm: 0.5

# Network architecture — MonoRace M23 baseline
# Separate policy and value networks (no shared backbone).
# SB3 FlattenExtractor passes obs through; net_arch defines each head.
policy_type: MlpPolicy
net_arch:
  pi: [64, 64, 64]
  vf: [64, 64, 64]
activation_fn: relu

# Exploration
use_sde: false
