_target_: control.algorithms.ppo.PPO

# SB3 PPO hyperparameters
learning_rate: 3e-4
n_steps: 2048
batch_size: 64
n_epochs: 10
gamma: 0.99
gae_lambda: 0.95
clip_range: 0.2
ent_coef: 0.01
vf_coef: 0.5
max_grad_norm: 0.5

# Network architecture
policy_type: MlpPolicy
# net_arch intentionally omitted — GCNetExtractor IS the network;
# SB3 should not add extra MLP layers on top of it.
activation_fn: relu

# Exploration
use_sde: false
