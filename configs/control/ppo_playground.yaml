_target_: control.algorithms.ppo.PPO

learning_rate: 3e-4
n_steps: 1000
batch_size: 5000
n_epochs: 10
gamma: 0.999
gae_lambda: 0.95
clip_range: 0.2
ent_coef: 0.005
vf_coef: 0.5
max_grad_norm: 0.5
policy_type: MlpPolicy
activation_fn: relu
log_std_init: -2.0     # playground uses tighter initial exploration
action_bias_init: [0.228, 0.5, 0.5, 0.5]  # hover thrust + centered rates

net_arch:
  pi: [64, 64, 64]
  vf: [64, 64, 64]
