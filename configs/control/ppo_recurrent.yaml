# RecurrentPPO with LSTM for temporal context.
_target_: control.algorithms.ppo.PPO
learning_rate: 0.0003
n_steps: 1000
batch_size: 5000
n_epochs: 10
gamma: 0.999
gae_lambda: 0.95
clip_range: 0.2
ent_coef: 0.005
vf_coef: 0.5
max_grad_norm: 0.5
policy_type: MlpLstmPolicy
activation_fn: relu
use_sde: false

# Recurrent settings
recurrent: true
lstm_hidden_size: 128
n_lstm_layers: 1

# Post-LSTM heads (smaller since LSTM does heavy lifting)
net_arch:
  pi: [64]
  vf: [64]
