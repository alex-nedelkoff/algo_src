# Perception noise injection for sim-to-real transfer
enabled: true

# HMM-based detection dropout
dropout_hmm:
  p_detect_to_miss: 0.05   # probability of transitioning from detected to missed
  p_miss_to_detect: 0.3    # probability of recovering detection

# Gaussian noise on gate position estimates
noise_std: 0.1  # metres, isotropic

# Simulated processing latency
latency_frames: 2
