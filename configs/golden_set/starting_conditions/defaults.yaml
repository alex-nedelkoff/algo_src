# Starting conditions for golden set benchmark.
# Each variant defines initial drone state for a benchmark episode.
# "null" position/attitude means "compute from gate_index" (place drone
# behind the target gate in hover orientation).

variants:
  - name: nominal
    description: Centered behind gate 0, hover state
    position: null
    velocity: [0.0, 0.0, 0.0]
    attitude: null
    omega: [0.0, 0.0, 0.0]
    gate_index: 0

  - name: perturbed_pos
    description: Offset position with slight velocity
    position_offset: [0.5, -0.3, 0.2]
    velocity: [1.0, 0.5, -0.2]
    attitude_perturbation: [0.05, -0.03]
    omega: [0.1, -0.1, 0.0]
    gate_index: 0

  - name: perturbed_fast
    description: Moving fast with attitude offset
    position_offset: [-0.3, 0.4, -0.1]
    velocity: [3.0, 1.0, 0.5]
    attitude_perturbation: [0.1, 0.08]
    omega: [0.3, -0.2, 0.1]
    gate_index: 0

  - name: lost
    description: Random position within arena, not near any gate
    position: [0.0, 0.0, 2.5]
    velocity: [0.0, 0.0, 0.0]
    attitude: [1.0, 0.0, 0.0, 0.0]
    omega: [0.0, 0.0, 0.0]
    gate_index: 0

  - name: mid_track
    description: Start at mid-track (50% through the gate sequence)
    position: null
    velocity: [0.0, 0.0, 0.0]
    attitude: null
    omega: [0.0, 0.0, 0.0]
    gate_fraction: 0.5  # resolved to gate_index = int(n_gates * fraction)
