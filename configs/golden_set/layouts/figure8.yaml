# Figure-8 track — hand-designed
# Two offset loops sharing a slightly offset crossing point near the origin.
# Gate orientations are yaw-only quaternions [w, x, y, z] pointing from
# current gate toward the next gate.
# Positions sourced from build_figure8_track() in sim/tracks.py.

track_type: hand_designed
arena_bounds: 5.0
gate_passage_radius: 0.75
max_steps: 1200

