# Elevation climb track — hand-designed
# 6 gates with significant elevation changes (z from 1.0 to 3.5).
# Tests vertical maneuvering within 5m arena bounds.
# Gate orientations are yaw-only quaternions [w, x, y, z] pointing from
# current gate toward the next gate (yaw component only; pitch is implicit
# from the z-delta between gates).

track_type: hand_designed
arena_bounds: 5.0
gate_passage_radius: 0.75
max_steps: 1200

gates:
  - position: [2.0, 0.0, 1.0]
    orientation: [0.433189, 0.0, 0.0, 0.901303]    # yaw=128.66 deg

  - position: [0.0, 2.5, 1.5]
    orientation: [0.316228, 0.0, 0.0, -0.948683]   # yaw=-143.13 deg

  - position: [-2.0, 1.0, 2.0]
    orientation: [0.707107, 0.0, 0.0, -0.707107]   # yaw=-90.00 deg

  - position: [-2.0, -1.0, 2.5]
    orientation: [0.948683, 0.0, 0.0, -0.316228]   # yaw=-36.87 deg

  - position: [0.0, -2.5, 3.0]
    orientation: [0.901303, 0.0, 0.0, 0.433189]    # yaw=51.34 deg

  - position: [2.0, 0.0, 3.5]
    orientation: [1.000000, 0.0, 0.0, 0.000000]    # yaw=0.00 deg
