# Hairpin track — hand-designed
# 6 gates featuring tight 180-degree turns (S-shaped with sharp reversals).
# All gates at z=2.0 within 5m arena bounds.
# Gate orientations are yaw-only quaternions [w, x, y, z] pointing from
# current gate toward the next gate.

track_type: hand_designed
arena_bounds: 5.0
gate_passage_radius: 0.75
max_steps: 1200

gates:
  - position: [3.0, -2.0, 2.0]
    orientation: [0.707107, 0.0, 0.0, 0.707107]    # yaw=90.00 deg

  - position: [3.0, 2.0, 2.0]
    orientation: [0.178425, 0.0, 0.0, 0.983954]    # yaw=159.44 deg

  - position: [-1.0, 3.5, 2.0]
    orientation: [0.316228, 0.0, 0.0, -0.948683]   # yaw=-143.13 deg

  - position: [-3.0, 2.0, 2.0]
    orientation: [0.707107, 0.0, 0.0, -0.707107]   # yaw=-90.00 deg

  - position: [-3.0, -2.0, 2.0]
    orientation: [0.983954, 0.0, 0.0, -0.178425]   # yaw=-20.56 deg

  - position: [1.0, -3.5, 2.0]
    orientation: [0.948683, 0.0, 0.0, 0.316228]    # yaw=36.87 deg
