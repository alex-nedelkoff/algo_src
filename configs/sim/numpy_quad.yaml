_target_: sim.envs.numpy_quad_factory.NumpyQuadEnvFactory

dt: 0.01
n_envs: 100
max_steps: 1000
gate_passage_radius: 1.0

# MonoRace: random gate start with perturbation + gate collision
random_gate_start: true
start_behind_dist: 1.0
start_vel_std: 0.5
start_att_std: 0.35
gate_collision: true
start_omega_std: 1.0
esc_nonlinearity: 0.95

# Racing quad vehicle parameters (5" racing quad, sysid)
params:
  _target_: sim.dynamics.params.VehicleParams
  mass: 0.752
  arm_length: 0.170
  k_thrust: 2.49e-6
  k_torque: 8.80e-8
  tau_motor: 0.04
  prop_radius: 0.0635
  inertia: [0.0025, 0.0025, 0.0045]
  drag_coeff: [0.01, 0.01, 0.005]
  max_rpm: 31470.0
