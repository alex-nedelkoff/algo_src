enabled: true
stages:
  - timestep: 0
    reward_weights:
      gate_progress: 1.0       # start with delta-progress for learning signal
      gate_offset: 0.5         # light offset penalty early on
      attitude_penalty: 0.3    # heavy attitude penalty early
      speed_bonus: 0.0
      action_smoothness: 0.05
    dr_scale: 0.0              # no DR initially
    gate_distance: 0.5         # start close
  - timestep: 1_000_000
    reward_weights:
      gate_progress: 0.5       # reduce progress, rely more on gate passage
      gate_offset: 1.5         # increase offset penalty
      attitude_penalty: 0.1
      speed_bonus: 0.03
      action_smoothness: 0.01
    dr_scale: 0.5
    gate_distance: 0.75
  - timestep: 5_000_000
    reward_weights:
      gate_progress: 0.0       # M16-style: gate passage bonus alone drives learning
      gate_offset: 2.0         # full offset penalty
      attitude_penalty: 0.1
      speed_bonus: 0.05
      action_smoothness: 0.01
    dr_scale: 1.0
    gate_distance: 1.0
