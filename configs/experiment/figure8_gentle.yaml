# @package _global_
# Gentle figure-8 exposure: mix tight figure-8s into training WITHOUT
# gate_collision termination. Learns figure-8 navigation from near-misses
# rather than binary death. Resumes from gate_fix (best general policy).

defaults:
  - override /sim: numpy_quad
  - override /control: ppo
  - override /perception: corner_noise
  - override /domain_rand: uniform_30pct
  - override /logging: wandb
  - _self_

sim:
  action_mode: trpy
  n_lookahead_gates: 2
  max_steps: 3000
  arena_bounds: 10
  gate_passage_radius: 1.5
  gate_collision: false        # KEY: don't terminate on gate clips — learn from them

total_timesteps: 20_000_000
resume_checkpoint: outputs/2026-03-19/17-06-24/final_model.zip  # gate_fix checkpoint

track_gen:
  n_gates_min: 4
  n_gates_max: 8
  gate_spacing_min: 1.5
  gate_spacing_max: 4.0
  turn_angle_min: -120
  turn_angle_max: 120
  elevation_min: 1.0
  elevation_max: 3.5
  elevation_delta_max: 0.6
  closure_max_angle: 90
  closure_max_retries: 10
  # Tighter figure-8s that better match the hardcoded one
  figure8_ratio: 0.4           # 40% figure-8s
  figure8:
    loop_radius_min: 1.5
    loop_radius_max: 2.5       # TIGHTER — closer to hardcoded ±3m
    gates_per_loop_min: 3
    gates_per_loop_max: 4      # FEWER — closer to hardcoded 4 per loop
    crossing_offset_min: 0.3
    crossing_offset_max: 0.6   # TIGHTER crossing
    elevation_min: 1.5
    elevation_max: 2.5         # FLATTER — closer to hardcoded z=2.0

perception:
  noise_scale: 1.0
  dropout_onset: null
  dropout_continuation: 0.7

reward:
  weights:
    gate_passage: 50.0
    gate_progress: 0.5
    gate_offset: 3.0           # Higher — precision matters on tight tracks
    body_rate: 0.001
    action_smoothness: 0.0
    crash_penalty: 5.0
    spline_proximity: 0.0
    heading_alignment: 0.0
    speed_bonus: 0.2
    boundary_penalty: 5.0
    gate_approach: 0.3
    gate_centering: 4.0        # High — centering is critical for figure-8
  v_max: 6.0
  action_smoothness_threshold: 0.5

control:
  ent_coef: 0.001

arpo:
  enabled: false

curriculum:
  enabled: true
  stages:
    - timestep: 0
      reward_weights:
        gate_passage: 50.0
        gate_progress: 0.5
        crash_penalty: 5.0
        speed_bonus: 0.2
        boundary_penalty: 5.0
        gate_approach: 0.3
        gate_centering: 4.0
      v_max: 5.0               # Conservative — learn figure-8 precision first
      ent_coef: 0.001
      trigger: null
    - timestep: 8_000_000
      reward_weights:
        gate_passage: 50.0
        gate_progress: 0.3
        crash_penalty: 5.0
        speed_bonus: 0.5
        boundary_penalty: 3.0
        gate_approach: 0.3
        gate_centering: 3.0
      v_max: 8.0
      ent_coef: 0.0008
      trigger:
        metric: racing/gate_passage_rate
        threshold: 0.90
        window: 200
    - timestep: 15_000_000
      reward_weights:
        gate_passage: 50.0
        gate_progress: 0.0
        crash_penalty: 3.0
        speed_bonus: 0.8
        boundary_penalty: 2.0
        gate_approach: 0.3
        gate_centering: 2.0
      v_max: 10.0
      ent_coef: 0.0005
      trigger:
        metric: racing/avg_speed
        threshold: 5.0
        window: 200

multi_scene:
  enabled: true
  n_scenes: 10

lr_schedule:
  initial_lr: 0.0001
  final_lr: 0.00003

logging:
  tags: ["trpy", "figure8-gentle", "no-gate-collision", "tight-fig8", "20M"]
  group: figure8_gentle
  notes: "Gentle figure-8: 40% tight fig-8 mix, gate_collision=false, centering=4, resume from gate_fix"
