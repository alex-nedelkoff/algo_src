# @package _global_
# PPO fine-tuning with EKF-filtered observations (playground Phase 4 PPO variant)
defaults:
  - override /loop: rl
  - override /sim: playground_quad
  - override /control: ppo_playground
  - override /perception: none
  - override /reward: mavlab_m23
