# @package _global_
# MoE + spline_speed: Replace scalar speed_bonus with directional spline speed.
# Resume from best MoE+H3 checkpoint (30M, 4.3 gates/ep, 82.5% success).
# Key change: speed_bonus=0, spline_speed=3.0 — rewards velocity projected
# along the spline tangent. Fast on straights, naturally teaches braking for turns.

defaults:
  - override /sim: numpy_quad
  - override /control: ppo_moe
  - override /perception: corner_noise
  - override /domain_rand: uniform_30pct
  - override /logging: wandb
  - _self_

sim:
  action_mode: trpy
  n_lookahead_gates: 2
  max_steps: 1200
  arena_bounds: 10
  gate_passage_radius: 1.5
  gate_collision: false

total_timesteps: 10_000_000
resume_checkpoint: outputs/2026-03-26/09-34-43/final_model  # MoE+H3 30M best

track_gen:
  n_gates_min: 4
  n_gates_max: 10
  gate_spacing_min: 1.0
  gate_spacing_max: 6.0
  turn_angle_min: -170
  turn_angle_max: 170
  elevation_min: 0.5
  elevation_max: 4.0
  elevation_delta_max: 1.5
  closure_max_angle: 120
  closure_max_retries: 30
  figure8_ratio: 0.3
  figure8:
    loop_radius_min: 1.5
    loop_radius_max: 3.0
    gates_per_loop_min: 3
    gates_per_loop_max: 4
    crossing_offset_min: 0.3
    crossing_offset_max: 0.6
    elevation_min: 1.0
    elevation_max: 3.0
    elevation_delta_max: 0.8

perception:
  noise_scale: 1.0
  dropout_onset: null
  dropout_continuation: 0.7

reward:
  weights:
    gate_passage: 100.0
    gate_progress: 3.0
    gate_offset: 3.0
    body_rate: 0.001
    action_smoothness: 0.0
    crash_penalty: 5.0
    spline_proximity: 1.0
    heading_alignment: 0.5
    speed_bonus: 0.0            # DISABLED — replaced by spline_speed
    spline_speed: 3.0           # NEW — velocity projected along spline tangent
    boundary_penalty: 2.0
    gate_approach: 0.1          # H3 anti-loiter
    gate_centering: 0.5         # H3 anti-loiter
  v_max: 7.5
  action_smoothness_threshold: 0.5

control:
  ent_coef: 0.005               # H3 entropy
  learning_rate: 0.0003
  log_std_init: -1.0

arpo:
  enabled: false
curriculum: null

multi_scene:
  enabled: true
  n_scenes: 10

autopilot:
  enabled: true
  check_freq: 5_000_000
  patience: 5
  degrade_threshold: 0.3

logging:
  tags: ["trpy", "moe", "autoresearch", "spline-speed", "directional-reward"]
  group: moe_spline_speed
  notes: "MoE + spline_speed reward (velocity along tangent). speed_bonus=0, spline_speed=3.0. Resume from MoE+H3 30M best."
