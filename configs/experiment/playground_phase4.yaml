# @package _global_
# Phase 4: DAgger distillation (EKF-filtered obs -> student network)
defaults:
  - override /loop: dagger
  - override /sim: playground_quad
  - override /perception: none
  - override /reward: mavlab_m23
  - override /domain_rand: uniform_30pct
  - override /logging: tensorboard

teacher_checkpoint: null  # REQUIRED: path to phase 3 checkpoint

# DAgger hyperparameters
dagger:
  hidden: [64, 64, 64]
  lr: 1e-3
  device: cpu
  n_rounds: 20
  steps_per_round: 50_000
  n_train_epochs: 10
  beta_start: 1.0
  beta_decay: 0.9

# EKF wrapper config
ekf:
  camera_kwargs: {}
  corner_noise_k: 2.0
  corner_dropout_onset: null
  provide_teacher_obs: true

seed: 42
