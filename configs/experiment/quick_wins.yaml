# @package _global_
# Quick wins: boundary penalty, gate approach reward, entropy annealing, LR decay.
# Resumes from speed+perception run.

defaults:
  - override /sim: numpy_quad
  - override /control: ppo
  - override /perception: corner_noise
  - override /domain_rand: uniform_30pct
  - override /logging: wandb
  - _self_

sim:
  action_mode: trpy
  n_lookahead_gates: 2
  max_steps: 3000
  arena_bounds: 10
  gate_passage_radius: 1.5

total_timesteps: 20_000_000
resume_checkpoint: outputs/2026-03-18/19-19-42/final_model.zip

track_gen:
  n_gates_min: 4
  n_gates_max: 8
  gate_spacing_min: 1.5
  gate_spacing_max: 4.0
  turn_angle_min: -120
  turn_angle_max: 120
  elevation_min: 1.0
  elevation_max: 3.5
  elevation_delta_max: 0.6
  closure_max_angle: 90
  closure_max_retries: 10

perception:
  noise_scale: 1.0
  dropout_onset: null
  dropout_continuation: 0.7

reward:
  weights:
    gate_passage: 50.0
    gate_progress: 0.5
    gate_offset: 2.0
    body_rate: 0.001
    action_smoothness: 0.0
    crash_penalty: 5.0
    spline_proximity: 0.0
    heading_alignment: 0.0
    speed_bonus: 0.3
    boundary_penalty: 5.0
    gate_approach: 0.2
  v_max: 6.0
  action_smoothness_threshold: 0.5

arpo:
  enabled: false

# Curriculum with entropy annealing
curriculum:
  enabled: true
  stages:
    - timestep: 0
      reward_weights:
        gate_passage: 50.0
        gate_progress: 0.5
        crash_penalty: 5.0
        speed_bonus: 0.3
        boundary_penalty: 5.0
        gate_approach: 0.2
      v_max: 6.0
      ent_coef: 0.005
      trigger: null
    - timestep: 5_000_000
      reward_weights:
        gate_passage: 50.0
        gate_progress: 0.3
        crash_penalty: 5.0
        speed_bonus: 0.5
        boundary_penalty: 3.0
        gate_approach: 0.3
      v_max: 8.0
      ent_coef: 0.003
      trigger:
        metric: racing/gate_passage_rate
        threshold: 0.95
        window: 200
    - timestep: 12_000_000
      reward_weights:
        gate_passage: 50.0
        gate_progress: 0.0
        crash_penalty: 3.0
        speed_bonus: 0.8
        boundary_penalty: 2.0
        gate_approach: 0.3
      v_max: 12.0
      ent_coef: 0.001
      trigger:
        metric: racing/avg_speed
        threshold: 7.0
        window: 200

multi_scene:
  enabled: true
  n_scenes: 10

# Cosine LR decay
lr_schedule:
  initial_lr: 0.0003
  final_lr: 0.00005

logging:
  tags: ["trpy", "quick-wins", "boundary", "approach", "entropy-anneal", "lr-decay", "20M"]
  group: quick_wins
  notes: "Quick wins: boundary penalty, gate approach, ent_coef 0.005->0.001, LR cosine 3e-4->5e-5"
