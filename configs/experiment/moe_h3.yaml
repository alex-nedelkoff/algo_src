# @package _global_
# MoE + H3 anti-loiter reward recipe.
# Resume from S1 30M checkpoint (92.5% gate passage).
# Apply the winning H3 reward shaping that gave 55% success on MLP.
# MoE has capacity for 5+ m/s — H3 recipe should teach it reliability.

defaults:
  - override /sim: numpy_quad
  - override /control: ppo_moe
  - override /perception: corner_noise
  - override /domain_rand: uniform_30pct
  - override /logging: wandb
  - _self_

sim:
  action_mode: trpy
  n_lookahead_gates: 2
  max_steps: 1200
  arena_bounds: 10
  gate_passage_radius: 1.5
  gate_collision: false

total_timesteps: 10_000_000
resume_checkpoint: outputs/2026-03-23/06-57-49/final_model  # S1 30M (best MoE checkpoint)

track_gen:
  n_gates_min: 4
  n_gates_max: 10
  gate_spacing_min: 1.0
  gate_spacing_max: 6.0
  turn_angle_min: -170
  turn_angle_max: 170
  elevation_min: 0.5
  elevation_max: 4.0
  elevation_delta_max: 1.5
  closure_max_angle: 120
  closure_max_retries: 30
  figure8_ratio: 0.3
  figure8:
    loop_radius_min: 1.5
    loop_radius_max: 3.0
    gates_per_loop_min: 3
    gates_per_loop_max: 4
    crossing_offset_min: 0.3
    crossing_offset_max: 0.6
    elevation_min: 1.0
    elevation_max: 3.0
    elevation_delta_max: 0.8

perception:
  noise_scale: 1.0
  dropout_onset: null
  dropout_continuation: 0.7

# H3 anti-loiter recipe (best from hyperparameter sweep) + higher v_max
reward:
  weights:
    gate_passage: 100.0        # Strong gate signal (from baseline tuning)
    gate_progress: 3.0
    gate_offset: 3.0
    body_rate: 0.001
    action_smoothness: 0.0
    crash_penalty: 5.0
    spline_proximity: 1.0      # Bootstrapping signal
    heading_alignment: 0.5     # Point along spline
    speed_bonus: 3.0           # H3: triple speed incentive
    boundary_penalty: 2.0      # Lower — less conservative
    gate_approach: 0.1         # H3: minimize loitering
    gate_centering: 0.5        # H3: gentle centering
  v_max: 7.5                   # Keep at 7.5 (v_max=10 caused OOB in H6)
  action_smoothness_threshold: 0.5

control:
  ent_coef: 0.005              # H3: more entropy for exploration
  learning_rate: 0.0003
  log_std_init: -1.0

arpo:
  enabled: false
curriculum: null

multi_scene:
  enabled: true
  n_scenes: 10

autopilot:
  enabled: true
  check_freq: 5_000_000
  patience: 5
  degrade_threshold: 0.3

logging:
  tags: ["trpy", "moe", "4-experts", "top-2", "autoresearch", "H3-recipe", "anti-loiter"]
  group: moe_h3
  notes: "MoE + H3 anti-loiter recipe. Resume from S1 30M. gate_approach=0.1, gate_centering=0.5, ent=0.005, speed_bonus=3"
