# @package _global_
# Generalist policy v3: progressive difficulty.
# Start easy (10m arena, 1.5m gates), progressively tighten to golden set
# params (5m arena, 0.75m gates). Spline-bootstrapped, no aRPO.

defaults:
  - override /sim: numpy_quad
  - override /control: ppo
  - override /perception: corner_noise
  - override /domain_rand: uniform_30pct
  - override /logging: wandb
  - _self_

sim:
  action_mode: trpy
  n_lookahead_gates: 2
  max_steps: 1200
  arena_bounds: 10            # START easy — curriculum will tighten
  gate_passage_radius: 1.5    # START easy — curriculum will tighten
  gate_collision: false

total_timesteps: 40_000_000

# Diverse tracks from the start — but arena/gates start easy
track_gen:
  n_gates_min: 4
  n_gates_max: 10
  gate_spacing_min: 1.0
  gate_spacing_max: 6.0
  turn_angle_min: -170
  turn_angle_max: 170
  elevation_min: 0.5
  elevation_max: 4.0
  elevation_delta_max: 1.5
  closure_max_angle: 120
  closure_max_retries: 30
  figure8_ratio: 0.3
  figure8:
    loop_radius_min: 1.5
    loop_radius_max: 3.0
    gates_per_loop_min: 3
    gates_per_loop_max: 4
    crossing_offset_min: 0.3
    crossing_offset_max: 0.6
    elevation_min: 1.0
    elevation_max: 3.0
    elevation_delta_max: 0.8

perception:
  noise_scale: 1.0
  dropout_onset: null
  dropout_continuation: 0.7

reward:
  weights:
    gate_passage: 1.5
    gate_progress: 1.0
    gate_offset: 1.5
    body_rate: 0.001
    action_smoothness: 0.0
    crash_penalty: 10.0
    spline_proximity: 3.0
    heading_alignment: 0.5
    speed_bonus: 0.0
    boundary_penalty: 10.0
    gate_approach: 0.2
    gate_centering: 2.0
  v_max: 5.0
  action_smoothness_threshold: 0.5

arpo:
  enabled: false

curriculum:
  enabled: true
  stages:
    # Stage 1: EASY — learn to fly and pass gates (5M steps)
    # 10m arena, 1.5m gate radius, heavy spline bootstrap
    - timestep: 0
      reward_weights:
        gate_passage: 1.5
        gate_progress: 1.0
        gate_offset: 1.5
        crash_penalty: 10.0
        spline_proximity: 3.0
        heading_alignment: 0.5
        boundary_penalty: 10.0
        gate_approach: 0.2
        gate_centering: 2.0
      v_max: 5.0
      ent_coef: 0.005
      arena_bounds: 10.0
      gate_passage_radius: 1.5
      trigger: null

    # Stage 2: MEDIUM — tighten arena and gates (5M steps)
    # 7m arena, 1.0m gate radius, reduce spline
    - timestep: 5_000_000
      reward_weights:
        gate_passage: 5.0
        gate_progress: 0.5
        gate_offset: 2.0
        crash_penalty: 8.0
        spline_proximity: 2.0
        heading_alignment: 0.3
        boundary_penalty: 8.0
        gate_approach: 0.3
        gate_centering: 3.0
      v_max: 8.0
      ent_coef: 0.004
      arena_bounds: 7.0
      gate_passage_radius: 1.0
      trigger:
        metric: racing/gate_passage_rate
        threshold: 0.50
        window: 200

    # Stage 3: HARD — tighter than golden set (30M steps!)
    # 5m arena, 0.5m gate radius (golden set uses 0.75 — train harder)
    - timestep: 10_000_000
      reward_weights:
        gate_passage: 10.0
        gate_progress: 0.5
        gate_offset: 2.0
        crash_penalty: 5.0
        spline_proximity: 1.0
        heading_alignment: 0.1
        speed_bonus: 0.2
        boundary_penalty: 5.0
        gate_approach: 0.3
        gate_centering: 3.0
      v_max: 10.0
      ent_coef: 0.002
      arena_bounds: 5.0
      gate_passage_radius: 0.5
      trigger:
        metric: racing/gate_passage_rate
        threshold: 0.40
        window: 200

multi_scene:
  enabled: true
  n_scenes: 10

lr_schedule:
  initial_lr: 0.0003
  final_lr: 0.00005

logging:
  tags: ["trpy", "generalist-v4", "progressive-difficulty", "spline-bootstrap", "diverse", "smaller-gates", "40M"]
  group: generalist_v4
  notes: "Generalist v4: 5M easy (10m/1.5m) -> 5M medium (7m/1.0m) -> 30M hard (5m/0.5m). Train tighter than golden set (0.5m vs 0.75m)."
