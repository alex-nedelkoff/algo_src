# @package _global_
# 5-expert MoE with expanded obs (33 dims): gate width/height + arena extent.
# Resume from checkpoint-surgery-expanded model. 20M fine-tuning steps.

defaults:
  - override /sim: numpy_quad
  - override /control: ppo_moe
  - override /perception: corner_noise
  - override /domain_rand: uniform_30pct
  - override /logging: wandb
  - _self_

sim:
  action_mode: trpy
  n_lookahead_gates: 2
  max_steps: 1200
  arena_bounds: 10
  gate_passage_radius: 0.75
  gate_collision: true
  start_vel_std: 1.5

total_timesteps: 20_000_000
resume_checkpoint: outputs/expanded_33dim/model

control:
  moe: true
  n_experts: 5
  expert_hidden_dim: 128
  top_k: 2
  balance_coef: 0.01
  ent_coef: 0.005
  learning_rate: 0.0003
  log_std_init: -1.0

track_gen:
  n_gates_min: 4
  n_gates_max: 14
  gate_spacing_min: 1.0
  gate_spacing_max: 6.0
  turn_angle_min: -170
  turn_angle_max: 170
  elevation_min: 0.5
  elevation_max: 4.0
  elevation_delta_max: 2.0
  elevation_bias: 0.3
  elevation_oscillation: 0.5
  closure_max_angle: 120
  closure_max_retries: 30
  figure8_ratio: 0.20
  figure8:
    loop_radius_min: 1.5
    loop_radius_max: 3.0
    gates_per_loop_min: 3
    gates_per_loop_max: 4
    crossing_offset_min: 0.3
    crossing_offset_max: 0.6
    elevation_min: 1.0
    elevation_max: 3.0
    elevation_delta_max: 0.8
  zigzag_ratio: 0.10
  zigzag:
    turn_angle_min: 100
    turn_angle_max: 160
    n_gates_min: 5
    n_gates_max: 8
    gate_spacing_min: 1.0
    gate_spacing_max: 4.0
    elevation_min: 0.5
    elevation_max: 4.0
    elevation_delta_max: 1.5
  composed_ratio: 0.40
  composed:
    segment_weights:
      slalom: 0.20
      straight: 0.15
      turn_90: 0.15
      turn_180: 0.12
      chicane: 0.12
      climb: 0.08
      dive: 0.08
      orbit: 0.10
    n_segments_min: 2
    n_segments_max: 5
    n_gates_max: 14
    closure_max_retries: 50
    perturbation:
      enabled: false

perception:
  noise_scale: 1.0
  dropout_onset: null
  dropout_continuation: 0.7

reward:
  weights:
    gate_passage: 100.0
    gate_progress: 3.0
    gate_offset: 3.0
    body_rate: 0.001
    action_smoothness: 0.0
    crash_penalty: 5.0
    spline_proximity: 1.0
    heading_alignment: 0.5
    speed_bonus: 0.0
    spline_speed: 3.0
    boundary_penalty: 5.0
    gate_approach: 0.1
    gate_centering: 0.5
    gate_speed_penalty: 2.0
  v_max: 7.5
  action_smoothness_threshold: 0.5

arpo:
  enabled: false
curriculum: null

multi_scene:
  enabled: true
  n_scenes: 10

autopilot:
  enabled: false

logging:
  tags: ["trpy", "moe", "5expert", "33dim", "gate-geometry", "arena-extent"]
  group: moe_33dim
  notes: "5-expert MoE with 33-dim obs (gate width/height + arena extent). boundary_penalty=5.0. Resume from expanded checkpoint."
