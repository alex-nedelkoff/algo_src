# @package _global_
# Training with perception noise injection for sim-to-real transfer

defaults:
  - override /sim: numpy_quad
  - override /control: ppo
  - override /perception: noise_injection
  - override /reward: perception_aware
  - override /domain_rand: uniform_30pct
  - override /logging: wandb

seed: 42
total_timesteps: 15_000_000

logging:
  tags: [perception, noise_injection, sim2real]
  group: perception_noise
