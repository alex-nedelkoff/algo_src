# @package _global_
# Deceleration expert training — COR-85
# Train a standalone expert on braking/reversal scenarios.
# High start_vel_std, tight zigzag tracks, speed-at-gate penalty.

defaults:
  - override /sim: numpy_quad
  - override /control: ppo_moe
  - override /perception: corner_noise
  - override /domain_rand: uniform_30pct
  - override /logging: wandb
  - _self_

sim:
  action_mode: trpy
  n_lookahead_gates: 2
  n_action_history: 7
  max_steps: 600
  arena_bounds: 10
  gate_passage_radius: 1.0
  gate_collision: true
  start_vel_std: 3.0
  start_att_std: 0.5

# Single expert, not MoE — train standalone
control:
  moe: false
  net_arch: [128, 128]
  learning_rate: 0.0003
  n_steps: 1000
  batch_size: 5000
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.001
  log_std_init: -1.0

total_timesteps: 30_000_000

track_gen:
  n_gates_min: 3
  n_gates_max: 5
  gate_spacing_min: 1.5
  gate_spacing_max: 4.0
  turn_angle_min: -170
  turn_angle_max: 170
  elevation_min: 0.5
  elevation_max: 4.0
  elevation_delta_max: 2.0
  elevation_bias: 0.0
  elevation_oscillation: 0.7
  closure_max_angle: 150
  closure_max_retries: 30
  figure8_ratio: 0.0
  zigzag_ratio: 0.5
  zigzag:
    turn_angle_min: 100
    turn_angle_max: 160
    n_gates_min: 3
    n_gates_max: 5
    gate_spacing_min: 1.5
    gate_spacing_max: 3.0
    elevation_min: 0.5
    elevation_max: 4.0
    elevation_delta_max: 2.0

perception:
  noise_scale: 1.0
  dropout_onset: null
  dropout_continuation: 0.7

reward:
  weights:
    gate_passage: 100.0
    gate_progress: 3.0
    gate_offset: 3.0
    body_rate: 0.005
    action_smoothness: 0.0
    crash_penalty: 10.0
    spline_proximity: 1.0
    heading_alignment: 0.5
    speed_bonus: 0.0
    spline_speed: 0.0
    boundary_penalty: 2.0
    gate_approach: 0.5
    gate_centering: 1.0
    gate_speed_penalty: 5.0
  v_max: 7.5
  action_smoothness_threshold: 0.5

arpo:
  enabled: false
curriculum: null

multi_scene:
  enabled: true
  n_scenes: 10

autopilot:
  enabled: true
  check_freq: 10_000_000
  patience: 5
  degrade_threshold: 0.3

logging:
  tags: ["decel-expert", "braking", "high-vel-start", "zigzag"]
  group: decel_expert
  notes: "Deceleration expert: start_vel_std=3.0, 50% zigzag, no spline_speed, high body_rate penalty, short episodes."
