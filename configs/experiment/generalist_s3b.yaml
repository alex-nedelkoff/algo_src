# @package _global_
# Generalist Stage 3b: Intermediate step — 6m arena, 0.85m gates.
# Resume from stage 2 (our best benchmark result).

defaults:
  - override /sim: numpy_quad
  - override /control: ppo
  - override /perception: corner_noise
  - override /domain_rand: uniform_30pct
  - override /logging: wandb
  - _self_

sim:
  action_mode: trpy
  n_lookahead_gates: 2
  max_steps: 1200
  arena_bounds: 6
  gate_passage_radius: 0.85
  gate_collision: false

total_timesteps: 10_000_000
resume_checkpoint: outputs/2026-03-22/12-30-45/final_model  # stage 2

track_gen:
  n_gates_min: 4
  n_gates_max: 10
  gate_spacing_min: 1.0
  gate_spacing_max: 6.0
  turn_angle_min: -170
  turn_angle_max: 170
  elevation_min: 0.5
  elevation_max: 4.0
  elevation_delta_max: 1.5
  closure_max_angle: 120
  closure_max_retries: 30
  figure8_ratio: 0.3
  figure8:
    loop_radius_min: 1.5
    loop_radius_max: 3.0
    gates_per_loop_min: 3
    gates_per_loop_max: 4
    crossing_offset_min: 0.3
    crossing_offset_max: 0.6
    elevation_min: 1.0
    elevation_max: 3.0
    elevation_delta_max: 0.8

perception:
  noise_scale: 1.0
  dropout_onset: null
  dropout_continuation: 0.7

reward:
  weights:
    gate_passage: 10.0
    gate_progress: 1.0
    gate_offset: 5.0
    body_rate: 0.001
    action_smoothness: 0.0
    crash_penalty: 5.0
    spline_proximity: 0.5
    heading_alignment: 0.05
    speed_bonus: 0.0
    boundary_penalty: 8.0
    gate_approach: 0.3
    gate_centering: 5.0
  v_max: 2.5
  action_smoothness_threshold: 0.5

control:
  ent_coef: 0.002
  learning_rate: 0.0001

arpo:
  enabled: false
curriculum: null

multi_scene:
  enabled: true
  n_scenes: 10

logging:
  tags: ["trpy", "generalist-s3b", "6m-arena", "0.85m-gates", "10M"]
  group: generalist_staged
  notes: "Stage 3b: intermediate 6m arena, 0.85m gates, v_max=2.5, resume from stage 2"
