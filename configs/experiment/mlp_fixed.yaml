# @package _global_
# MLP with fixed log_std — the critical fix applied to the proven architecture.
# Same diverse tracks as MoE S1 but with the simple 3x64 MLP.

defaults:
  - override /sim: numpy_quad
  - override /control: ppo
  - override /perception: corner_noise
  - override /domain_rand: uniform_30pct
  - override /logging: wandb
  - _self_

sim:
  action_mode: trpy
  n_lookahead_gates: 2
  max_steps: 1200
  arena_bounds: 10
  gate_passage_radius: 1.5
  gate_collision: false

total_timesteps: 10_000_000

track_gen:
  n_gates_min: 4
  n_gates_max: 10
  gate_spacing_min: 1.0
  gate_spacing_max: 6.0
  turn_angle_min: -170
  turn_angle_max: 170
  elevation_min: 0.5
  elevation_max: 4.0
  elevation_delta_max: 1.5
  closure_max_angle: 120
  closure_max_retries: 30
  figure8_ratio: 0.3
  figure8:
    loop_radius_min: 1.5
    loop_radius_max: 3.0
    gates_per_loop_min: 3
    gates_per_loop_max: 4
    crossing_offset_min: 0.3
    crossing_offset_max: 0.6
    elevation_min: 1.0
    elevation_max: 3.0
    elevation_delta_max: 0.8

perception:
  noise_scale: 1.0
  dropout_onset: null
  dropout_continuation: 0.7

reward:
  weights:
    gate_passage: 50.0
    gate_progress: 3.0
    gate_offset: 3.0
    body_rate: 0.001
    action_smoothness: 0.0
    crash_penalty: 5.0
    spline_proximity: 0.1
    heading_alignment: 0.05
    speed_bonus: 1.0
    boundary_penalty: 5.0
    gate_approach: 1.0
    gate_centering: 3.0
  v_max: 5.0
  action_smoothness_threshold: 0.5

control:
  ent_coef: 0.001
  learning_rate: 0.0003
  log_std_init: -1.0          # THE FIX — was 0.0

arpo:
  enabled: false
curriculum: null

multi_scene:
  enabled: true
  n_scenes: 10

logging:
  tags: ["trpy", "mlp-fixed", "log-std-fix", "diverse", "10M"]
  group: mlp_fixed
  notes: "MLP with fixed log_std=-1.0, ent_coef=0.001. Same diverse tracks. The critical fix applied to proven architecture."
