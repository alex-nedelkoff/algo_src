# @package _global_
# Recurrent G&CNet: LSTM policy with 3-gate lookahead.
# Training from scratch — cannot resume from MLP checkpoints.

defaults:
  - override /sim: numpy_quad
  - override /control: ppo_recurrent
  - override /perception: corner_noise
  - override /domain_rand: uniform_30pct
  - override /logging: wandb
  - _self_

sim:
  action_mode: trpy
  n_lookahead_gates: 3        # 32-dim obs (was 2/28-dim)
  max_steps: 3000
  arena_bounds: 10
  gate_passage_radius: 1.5
  gate_collision: false

total_timesteps: 40_000_000
# No resume — training from scratch with new architecture

track_gen:
  n_gates_min: 4
  n_gates_max: 8
  gate_spacing_min: 1.5
  gate_spacing_max: 4.0
  turn_angle_min: -120
  turn_angle_max: 120
  elevation_min: 1.0
  elevation_max: 3.5
  elevation_delta_max: 0.6
  closure_max_angle: 90
  closure_max_retries: 10
  figure8_ratio: 0.4
  figure8:
    loop_radius_min: 1.5
    loop_radius_max: 2.5
    gates_per_loop_min: 3
    gates_per_loop_max: 4
    crossing_offset_min: 0.3
    crossing_offset_max: 0.6
    elevation_min: 1.5
    elevation_max: 2.5
    elevation_delta_max: 0.6

perception:
  noise_scale: 1.0
  dropout_onset: null
  dropout_continuation: 0.7

reward:
  weights:
    gate_passage: 1.5
    gate_progress: 1.0
    gate_offset: 1.5
    body_rate: 0.001
    action_smoothness: 0.0
    crash_penalty: 10.0
    spline_proximity: 0.5
    heading_alignment: 0.05
    speed_bonus: 0.0
    boundary_penalty: 3.0
    gate_approach: 0.2
    gate_centering: 3.0
  v_max: 10.0
  action_smoothness_threshold: 0.5

# aRPO bootstrap — helps LSTM learn from consistent trajectories
arpo:
  enabled: true
  k_end_fraction: 0.15        # Remove base policy by 6M steps

curriculum:
  enabled: true
  stages:
    - timestep: 0
      reward_weights:
        gate_passage: 1.5
        gate_progress: 1.0
        gate_offset: 1.5
        crash_penalty: 10.0
        spline_proximity: 0.5
        heading_alignment: 0.05
        speed_bonus: 0.0
        boundary_penalty: 3.0
        gate_approach: 0.2
        gate_centering: 3.0
      v_max: 10.0
      ent_coef: 0.005
      trigger: null
    - timestep: 10_000_000
      reward_weights:
        gate_passage: 10.0
        gate_progress: 0.5
        gate_offset: 2.0
        crash_penalty: 5.0
        spline_proximity: 0.2
        heading_alignment: 0.03
        speed_bonus: 0.3
        boundary_penalty: 3.0
        gate_approach: 0.3
        gate_centering: 2.0
      v_max: 15.0
      ent_coef: 0.003
      trigger:
        metric: racing/gate_passage_rate
        threshold: 0.80
        window: 200
    - timestep: 25_000_000
      reward_weights:
        gate_passage: 50.0
        gate_progress: 0.0
        gate_offset: 2.0
        crash_penalty: 3.0
        spline_proximity: 0.0
        heading_alignment: 0.0
        speed_bonus: 0.8
        boundary_penalty: 2.0
        gate_approach: 0.3
        gate_centering: 1.0
      v_max: 30.0
      ent_coef: 0.001
      trigger:
        metric: racing/lap_completion_rate
        threshold: 0.5
        window: 200

multi_scene:
  enabled: true
  n_scenes: 10

lr_schedule:
  initial_lr: 0.0003
  final_lr: 0.00005

logging:
  tags: ["trpy", "recurrent", "lstm-128", "lookahead-3", "figure8", "arpo", "40M"]
  group: recurrent_gcnet
  notes: "Recurrent G&CNet: LSTM(128) + MLP(64,64), n_lookahead=3, 40pct figure-8, aRPO, from scratch"
