# @package _global_
# MoE Stage 2: Tighten to 7m arena, 1.0m gates.
# Resume from S1 30M checkpoint (92.5% gate passage, before degradation).

defaults:
  - override /sim: numpy_quad
  - override /control: ppo_moe
  - override /perception: corner_noise
  - override /domain_rand: uniform_30pct
  - override /logging: wandb
  - _self_

sim:
  action_mode: trpy
  n_lookahead_gates: 2
  max_steps: 1200
  arena_bounds: 7
  gate_passage_radius: 1.0
  gate_collision: false

total_timesteps: 30_000_000
resume_checkpoint: outputs/2026-03-23/06-57-49/final_model  # S1 30M (the good checkpoint)

track_gen:
  n_gates_min: 4
  n_gates_max: 10
  gate_spacing_min: 1.0
  gate_spacing_max: 6.0
  turn_angle_min: -170
  turn_angle_max: 170
  elevation_min: 0.5
  elevation_max: 4.0
  elevation_delta_max: 1.5
  closure_max_angle: 120
  closure_max_retries: 30
  figure8_ratio: 0.3
  figure8:
    loop_radius_min: 1.5
    loop_radius_max: 3.0
    gates_per_loop_min: 3
    gates_per_loop_max: 4
    crossing_offset_min: 0.3
    crossing_offset_max: 0.6
    elevation_min: 1.0
    elevation_max: 3.0
    elevation_delta_max: 0.8

perception:
  noise_scale: 1.0
  dropout_onset: null
  dropout_continuation: 0.7

reward:
  weights:
    gate_passage: 50.0
    gate_progress: 2.0
    gate_offset: 4.0
    body_rate: 0.001
    action_smoothness: 0.0
    crash_penalty: 5.0
    spline_proximity: 0.3       # Low — prevent hover dominance
    heading_alignment: 0.05
    speed_bonus: 0.3
    boundary_penalty: 8.0       # Higher — 7m arena is tighter
    gate_approach: 0.5
    gate_centering: 4.0         # Higher — 1.0m gates need precision
  v_max: 3.0
  action_smoothness_threshold: 0.5

arpo:
  enabled: false
curriculum: null

multi_scene:
  enabled: true
  n_scenes: 10

logging:
  tags: ["trpy", "moe", "4-experts", "top-2", "s2", "7m", "1.0m", "30M"]
  group: moe_staged
  notes: "MoE S2: 7m/1.0m, resume from S1 30M, gate_passage=50, spline=0.3"
