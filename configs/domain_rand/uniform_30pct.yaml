# Full uniform domain randomization (MonoRace default)
# Values are symmetric percentage deviations: U[nominal*(1-p), nominal*(1+p)]
enabled: true
params:
  mass: 0.3           # +-30%
  inertia: 0.3        # +-30% on diagonal
  k_thrust: 0.3       # +-30%
  k_torque: 0.3       # +-30%
  tau_motor: 0.5      # +-50% (MonoRace competition: 50-55%)
  arm_length: 0.1     # +-10% (structural, less variation)
  drag_coeff: 0.3     # +-30%
