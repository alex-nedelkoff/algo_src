# Domain randomization for the VQ drone (Swift recipe: train over the uncertainties).
# Symmetric percentage deviations U[nominal*(1-p), nominal*(1+p)]. Wide on the under-identified
# terms; tight on the well-identified ones.
enabled: true
params:
  mass: 0.3            # +-30% (absolute scale degenerate)
  inertia: 0.5         # +-50% diagonal — wide, esp. Izz (under-identified; spans ~the [1,22]xIyy range)
  k_thrust: 0.2        # +-20% (hover-calibrated, fairly tight)
  k_torque: 0.5        # +-50% (weak yaw authority, uncertain)
  tau_motor: 0.5       # +-50% (motor lag; competition-style)
  arm_length: 0.1      # +-10% (structural)
  drag_coeff: 1.0      # quadratic parasitic: unmeasured -> span 0..2x a small value (set a nonzero nominal to activate)
  linear_drag_coeff: 0.3   # +-30% (D_x lit-validated; D_y less so)
  weathervane_coeff: 0.75  # +-75% — magnitude k_q/Izz-conditional; spans mild..strong tail-first (sign fixed)
